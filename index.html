<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti, con Amor 💖</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffdf9;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 20px;
        }
        h1 { color: #e27d60; }
        p { line-height: 1.6; }
        .polaroid {
            background: white;
            padding: 10px 10px 20px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 20px 0;
            border-radius: 4px;
        }
        .polaroid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .btn {
            background-color: #e27d60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-secondary {
            background-color: #c38d9e;
        }
        .qr-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #f0f0f0;
        }
        .qr-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            margin-top: 15px;
        }
        .qr-input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
        #qrcode img {
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            padding: 10px;
            background: white;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Para Ti, con Amor 💖</h1>
        <p>Gracias por llenar mis días de alegría y momentos hermosos. Esta tarjeta es para recordarte lo especial que eres.</p>
        
        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80" alt="Foto">
            <p>Momentos mágicos ✨</p>
        </div>

        <button class="btn" onclick="alert('¡Te quiero muchísimo! 💖')">¡Presióname! ✨</button>

        <div class="qr-section">
            <h3 style="color: #e27d60;">Generador de Código QR</h3>
            <p style="font-size: 14px; color: #777;">Copia y pega el enlace de tu tarjeta aquí abajo para generar tu código QR y descargarlo:</p>
            <div class="qr-input-group">
                <input type="text" id="urlInput" placeholder="https://tu-usuario.github.io/tu-repositorio">
                <button class="btn" id="generateQrBtn">Generar QR</button>
            </div>
            <div id="qrcode"></div>
            <button class="btn btn-secondary hidden" id="downloadQrBtn">⬇️ Descargar Imagen QR</button>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const generateBtn = document.getElementById('generateQrBtn');
        const qrcodeContainer = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('downloadQrBtn');
        
        if (window.location.protocol.startsWith('http')) urlInput.value = window.location.href;

        function makeQrCode() {
            qrcodeContainer.innerHTML = "";
            const text = urlInput.value.trim();
            if (!text) return;
            try {
                var qr = qrcode(0, 'H');
                qr.addData(text);
                qr.make();
                qrcodeContainer.innerHTML = qr.createImgTag(5, 10);
                downloadBtn.classList.remove('hidden');
                const img = qrcodeContainer.querySelector('img');
                setTimeout(() => {
                    downloadBtn.onclick = function() {
                        const link = document.createElement('a');
                        link.download = 'codigo-qr-tarjeta.png';
                        link.href = img.src;
                        link.click();
                    };
                }, 100);
            } catch (err) {}
        }

        generateBtn.addEventListener('click', makeQrCode);
        if (urlInput.value) makeQrCode();
    </script>
</body>
</html>
