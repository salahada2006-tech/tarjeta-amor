<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti, con Amor 💖</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffdf9;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 20px;
        }
        h1 { color: #e27d60; }
        p { line-height: 1.6; }
        .polaroid {
            background: white;
            padding: 10px 10px 20px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 20px 0;
            border-radius: 4px;
        }
        .polaroid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .btn {
            background-color: #e27d60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Para Ti, con Amor 💖</h1>
        <p>Gracias por llenar mis días de alegría y momentos hermosos. Esta tarjeta es para recordarte lo especial que eres.</p>
        
        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80" alt="Foto">
            <p>Momentos mágicos ✨</p>
        </div>

        <button class="btn" onclick="alert('¡Te quiero muchísimo! 💖')">¡Presióname! ✨</button>
    </div>
</body>
</html>
