<head>

    <style>
        :root {
            --primary-color: #e27d60;
            --secondary-color: #e8a87c;
            --accent-color: #c38d9e;
            --bg-color: #fffdf9;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --pink-light: #fde8e8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo de corazones flotantes animados */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(226, 125, 96, 0.15);
            font-size: 20px;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Contenedor principal */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Cabecera */
        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--pink-light), #fff);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid rgba(226, 125, 96, 0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.95rem;
            color: #777;
        }

        /* Tarjeta de Mensaje */
        .message-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            line-height: 1.8;
            font-size: 1rem;
            text-align: justify;
            border-top: 4px solid var(--primary-color);
        }

        .message-card h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-align: center;
        }

        /* Galería tipo Polaroid */
        .gallery-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            text-align: center;
        }

        .gallery-section h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .polaroid-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .polaroid {
            background: #fff;
            padding: 12px 12px 25px 12px;
            width: 85%;
            max-width: 280px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 4px;
            transform: rotate(-2deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .polaroid:nth-child(even) {
            transform: rotate(2deg);
        }

        .polaroid:hover {
            transform: scale(1.03) rotate(0deg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .polaroid img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 2px;
        }

        .polaroid p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            margin-top: 12px;
            color: var(--text-color);
        }

        /* Botones de Acción e Interacción */
        .actions-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
